    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .thank-you-box {
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            max-width: 480px;
            width: 100%;
            border-top: 5px solid #22c55e;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background: #dcfce7;
            color: #15803d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }
        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            background: #1a73e8;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .btn-home:hover {
            background: #1557b0;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(26, 115, 232, 0.4);
        }
        @media (max-width: 480px) {
            .thank-you-box {
                padding: 35px 20px;
            }
            h1 {
                font-size: 21px;
            }
            p {
                font-size: 14px;
            }
        }
    </style>

        <a href="index.html" class="btn-home">Go Back to Home</a>

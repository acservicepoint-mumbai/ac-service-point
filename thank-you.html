<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - AC Service Point</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .thank-you-box {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background: #e6f4ea;
            color: #137333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }
        h1 {
            color: #202124;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #5f6368;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-block;
            background: #1a73e8;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn-home:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>

    <div class="thank-you-box">
        <div class="success-icon">&#10003;</div>
        <h1>Booking Received Successfully!</h1>
        <p>Thank you for reaching out to <strong>AC Service Point</strong>. We have received your booking details and our technician will contact you shortly.</p>
        <a href="index.html" class="btn-home">Go Back to Home</a>
    </div>

</body>
</html>
